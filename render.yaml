services:
  - type: web
    name: caloriq-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm run api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PHOTOS_BUCKET
        value: progress-photos
      - key: APP_LATEST_VERSION
        sync: false
      - key: APP_LATEST_VERSION_CODE
        sync: false
      - key: APP_MIN_VERSION_CODE
        sync: false
      - key: APP_DOWNLOAD_URL
        sync: false
      - key: APP_RELEASE_NOTES
        sync: false
      - key: TRUST_PROXY
        value: 1
      - key: DISPLAY_TIME_ZONE
        value: America/Sao_Paulo
